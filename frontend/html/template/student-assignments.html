<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adaptive LMS | My Assignments</title>
    <!-- Dependencies from template -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/plugins/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/feather.css">
    <link rel="stylesheet" href="assets/css/iconsax.css">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .assignment-card {
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .assignment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .assignment-card.submitted {
            border-left: 5px solid #28a745;
        }
        .assignment-card.pending {
            border-left: 5px solid #ffc107;
        }
        .assignment-card.overdue {
            border-left: 5px solid #dc3545;
        }
        
        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .dark-mode .assignment-card {
            background: #2c2c2c;
            border-color: #444;
        }
        
        .progress-micro {
            height: 4px;
            border-radius: 2px;
            background: #eee;
            margin-top: 10px;
        }
        .progress-micro .bar {
            height: 100%;
            background: linear-gradient(90deg, #007bff, #00c4ff);
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Header reuse -->
        <header class="header-two">
             <div class="container">
                <div class="header-nav">
                    <div class="navbar-header">
                        <a class="navbar-brand logo" href="index-3.html">
                            <img src="assets/img/logo.png" class="img-fluid" alt="Logo" style="width: 200px;">
                        </a>
                    </div>
                     <div class="main-menu-wrapper">
                         <div class="menu-header">
                            <a href="index-3.html" class="menu-logo">
                                <img src="assets/img/logo.png" class="img-fluid" alt="Logo">
                            </a>
                            <a id="menu_close" class="menu-close" href="javascript:void(0);"> <i class="fas fa-times"></i></a>
                        </div>
                         <div class="header-btn d-flex align-items-center">
                            <div class="icon-btn me-2">
                                <a href="javascript:void(0);" id="dark-mode-toggle" class="theme-toggle activate"><i class="isax isax-sun-15"></i></a>
                                <a href="javascript:void(0);" id="light-mode-toggle" class="theme-toggle"><i class="isax isax-moon"></i></a>
                            </div>
                            <div class="dropdown profile-dropdown">
                                <a href="javascript:void(0);" class="d-flex align-items-center" data-bs-toggle="dropdown">
                                    <span class="avatar"><img src="assets/img/avatar.png" alt="Img" class="img-fluid rounded-circle dropdown-profile-img"></span>
                                </a>
                                <div class="dropdown-menu dropdown-menu-end">
                                    <a class="dropdown-item" href="student-dashboard.html">Dashboard</a>
                                    <a class="dropdown-item" href="login.html">Logout</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

         <!-- Breadcrumb -->
        <div class="breadcrumb-bar py-4 bg-light">
             <div class="container">
                 <div class="row">
                     <div class="col-md-12">
                         <h2 class="breadcrumb-title">My Assignments</h2>
                         <nav aria-label="breadcrumb">
                             <ol class="breadcrumb">
                                 <li class="breadcrumb-item"><a href="student-dashboard.html">Dashboard</a></li>
                                 <li class="breadcrumb-item active" aria-current="page">Assignments</li>
                             </ol>
                         </nav>
                     </div>
                 </div>
             </div>
        </div>

        <div class="content mt-5">
            <div class="container">
                <div class="row">
                    <!-- Filters -->
                    <div class="col-lg-3">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <h6 class="mb-3">Filter</h6>
                                <div class="form-check mb-2">
                                    <input class="form-check-input filter-cb" type="radio" name="status" id="status-all" value="all" checked>
                                    <label class="form-check-label" for="status-all">All Assignments</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input filter-cb" type="radio" name="status" id="status-pending" value="pending">
                                    <label class="form-check-label" for="status-pending">Pending</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input filter-cb" type="radio" name="status" id="status-submitted" value="submitted">
                                    <label class="form-check-label" for="status-submitted">Submitted</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Assignments List -->
                    <div class="col-lg-9">
                        <div id="assignments-container">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="mt-2 text-muted">Loading your assignments...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Assignment Details & Submit Modal -->
        <div class="modal fade" id="assignmentModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modal-title">Assignment Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="modal-details" class="mb-4">
                            <!-- Populated by JS -->
                        </div>

                        <hr>

                        <!-- Submission Form -->
                        <div id="submission-section">
                            <h6 class="mb-3 fw-bold">Submit Your Work</h6>
                            <form id="submission-form">
                                <input type="hidden" id="sub-assignment-id">
                                
                                <ul class="nav nav-tabs mb-3" id="submitTabs" role="tablist">
                                    <li class="nav-item">
                                        <button class="nav-link active" id="text-tab" data-bs-toggle="tab" data-bs-target="#tab-text" type="button">Text Answer</button>
                                    </li>
                                    <li class="nav-item">
                                        <button class="nav-link" id="file-tab" data-bs-toggle="tab" data-bs-target="#tab-file" type="button">Upload PDF</button>
                                    </li>
                                </ul>

                                <div class="tab-content" id="submitTabContent">
                                    <div class="tab-pane fade show active" id="tab-text">
                                        <div class="mb-3">
                                            <label class="form-label">Type your answer here</label>
                                            <textarea class="form-control" id="answer-text" rows="10" placeholder="Write your detailed answer..."></textarea>
                                        </div>
                                    </div>
                                    <div class="tab-pane fade" id="tab-file">
                                        <div class="mb-3">
                                            <label class="form-label">Upload Answer PDF</label>
                                            <input type="file" class="form-control" id="answer-file" accept=".pdf">
                                            <small class="text-muted">Recommended for long assignments.</small>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-alert alert alert-warning d-none" id="sub-error"></div>

                                <div class="mt-3 text-end">
                                    <button type="submit" class="btn btn-primary px-4" id="btn-submit">
                                        <span class="spinner-border spinner-border-sm d-none me-2"></span>
                                        Submit Assignment
                                    </button>
                                </div>
                            </form>
                        </div>
                        
                        <!-- Evaluation Result (Hidden by default) -->
                        <div id="evaluation-section" class="d-none">
                            <h6 class="fw-bold text-success mb-3"><i class="fas fa-check-circle me-2"></i>Evaluated</h6>
                            <div class="card border-success bg-light">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h2 class="mb-0 text-success fw-bold" id="eval-score">0/100</h2>
                                        <span class="badge bg-success">Completed</span>
                                    </div>
                                    <h6 class="fw-bold">Feedback</h6>
                                    <p id="eval-feedback" class="text-muted mb-0">No feedback provided.</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/moment.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/student-assignments.js"></script>
</body>
</html>
